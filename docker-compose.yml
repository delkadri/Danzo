services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=danzo
      - POSTGRES_USER=danzo
      - POSTGRES_PASSWORD=danzo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U danzo -d danzo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - CORS_ORIGIN=*
      - DATABASE_URL=postgresql+psycopg://danzo:danzo@db:5432/danzo
      - CATALOG_AUTO_SEED=true
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    environment:
      - VITE_BACKEND_URL=http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
